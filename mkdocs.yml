site_name: CSNote

theme:
  name: material
  features:
    - content.code.select
    - content.code.copy
    - content.code.cop
    - navigation.tabs
    - navigation.top

    # - navigation.prune
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default 
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
        
  custom_dir: overrides

repo_url: https://github.com/Nopthon/csnotes

repo_name: CSNote repo

plugins:
  - mermaid2
  - statistics
  - glightbox
  - document-dates:
      position: bottom # top
      type: date
      # exclude:
      date_format: '%Y-%m-%d'
      time_format: '%H:%M:%S'
      show_author: false
#  - privacy

#   - blog

nav: 
  - intro: index.md
  - OI-learning: 
    - intro: OI-Learning/index.md
    - C++ 面向对象: OI-Learning/C++ OOP.md

