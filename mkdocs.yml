site_name: CSNote

theme:
  name: material
  logo: assets/burger.svg
  features:
    - content.code.select
    - content.code.copy
    - content.code.cop
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - navigation.path
    # - navigation.prune
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default 
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
        
  custom_dir: overrides

# repo_url: https://github.com/Nopthon/csnotes

# repo_name: CSNote repo

plugins:
  - search
  - mermaid2:
    # javascript: https://cdn.jsdelivr.net/npm/mermaid@10.4.0/dist/mermaid.min.js
  # - statistics
  - glightbox:
      width: 80%
  - blog:
      archive: false
      # archive_date_format: MMMM yyyy
      post_readtime: true
      post_url_format: "{categories}/{slug}"
      post_url_max_categories: 2
      

  - document-dates:
      position: bottom # top
      type: date
      # exclude:
      date_format: '%Y-%m-%d'
      time_format: '%H:%M:%S'
      show_author: false
  # - privacy
  - encryptcontent: {}

  # - build-cache



